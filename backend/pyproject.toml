[project]
name = "comark-backend"
version = "0.1.0"
description = "CoMark — collaborative Markdown editor API + realtime engine"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.31.0",
    "alembic>=1.19.1",
    "fastapi-users[sqlalchemy,oauth]>=15.0.5",
    "redis>=8.1.0",
    "pyjwt>=2.13.0",
    "python-slugify>=8.0.4",
    "pycrdt>=0.14.4",
    "pycrdt-websocket>=0.16.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "anyio>=4.11",
    "httpx>=0.28",
    "asgi-lifespan>=2.1.0",
    "testcontainers[postgres,redis]>=4.15.0",
    "ruff>=0.16.5",
    "mypy>=2.3.1",
    "httpx-ws>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "C4", "SIM", "TID"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.ruff.lint.per-file-ignores]
"app/db/migrations/*" = ["E501"]
"tests/*" = ["B008", "SIM117"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
exclude = ["app/db/migrations/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/db/migrations/*"]
